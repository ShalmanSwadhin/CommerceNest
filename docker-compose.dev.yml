# Local development dependencies only (Postgres + Redis)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commercenest
      POSTGRES_USER: commercenest
      POSTGRES_PASSWORD: commercenest
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercenest"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

volumes:
  pgdata_dev:
