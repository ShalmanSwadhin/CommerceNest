# CommerceNest reverse-proxy — single public entry (port 80/443).
# Host model matches production SaaS:
#   apex / www               Marketing homepage
#   admin.<domain>           Master Admin
#   app.<domain>             Store Admin
#   <store-slug>.<domain>    Storefront
#   /api on every host       API (same-origin SPA)

upstream cn_api { server api:4000; }
upstream cn_admin { server admin-panel:80; }
upstream cn_dashboard { server store-dashboard:80; }
upstream cn_storefront { server storefront:80; }
upstream cn_marketing { server marketing:80; }

# Marketing homepage (platform apex)
server {
  listen 80;
  server_name commercenest.com www.commercenest.com commercenest.local www.commercenest.local localhost;

  location /api/ {
    proxy_pass http://cn_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://cn_marketing;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Master Admin
server {
  listen 80;
  server_name admin.commercenest.com admin.commercenest.local admin.localhost;

  location /api/ {
    proxy_pass http://cn_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://cn_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Store Admin
server {
  listen 80;
  server_name app.commercenest.com app.commercenest.local app.localhost dashboard.commercenest.com dashboard.localhost;

  location /api/ {
    proxy_pass http://cn_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://cn_dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# Optional dedicated API host
server {
  listen 80;
  server_name api.commercenest.com api.commercenest.local api.localhost;

  location / {
    proxy_pass http://cn_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Wildcard storefront + custom domains (default)
server {
  listen 80 default_server;
  server_name _;

  location /api/ {
    proxy_pass http://cn_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sitemap.xml {
    proxy_pass http://cn_api/api/storefront/_seo/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /robots.txt {
    proxy_pass http://cn_api/api/storefront/_seo/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://cn_storefront;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
